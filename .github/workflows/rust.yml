# Checks of the Rust workspace in rust/ (ADR 0110-workspace-and-ci).
# Runs on every push to `rust` and on every pull request whose base is `rust`,
# with no path filter, so that every such pull request carries the checks.
name: rust

on:
  push:
    branches: [rust]
  pull_request:
    branches: [rust]

permissions:
  contents: read

# A newer push to the same pull request cancels the run it supersedes. Runs of
# pushes to `rust` are never cancelled, so that each merge reports its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        # `shell: bash` runs with -eo pipefail; the default shell has no pipefail.
        shell: bash
        working-directory: rust
    env:
      CARGO_TERM_COLOR: always
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Installs the release and components named in rust/rust-toolchain.toml.
      - name: Install the toolchain
        run: rustup toolchain install --no-self-update && rustc --version
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --locked --workspace
      # ADR 0107-crate-split: the parsing crates depend on no herdr client, no
      # child-process crate, no async runtime and no HTTP library. The tree is
      # resolved for the whole workspace, as the builds above are, so a feature
      # that another member turns on in a shared dependency shows up here too.
      - name: Parsing crates have no I/O dependencies
        run: |
          tree=$(cargo tree --locked --workspace -e normal --no-dedupe --prefix depth --format ' {p}')
          edges=$(printf '%s\n' "$tree" | awk '
            $1 == "0" { root = $2; if (root ~ /^herdr-fleet-(screen|transcript)$/) print root " -> " root; next }
            NF >= 2 && root ~ /^herdr-fleet-(screen|transcript)$/ { print root " -> " $2 }' | sort -u)
          for crate in herdr-fleet-screen herdr-fleet-transcript; do
            if ! grep -qx "$crate -> $crate" <<<"$edges"; then
              echo "::error::$crate is not a member of the workspace"
              exit 1
            fi
          done
          found=$(grep -E ' -> (herdr-fleet-herdr|herdr-fleet-child-process|tokio|axum|hyper|reqwest)$' <<<"$edges" || true)
          if [ -n "$found" ]; then
            echo "::error::a parsing crate depends on a banned package:"
            echo "$found"
            exit 1
          fi
      # ADR 0110-workspace-and-ci: tests that read the corpus or write temporary
      # files live in tests/ and allow the banned APIs there; src/ never does.
      # ADR 0225-nonblocking-image-open excepts one file: transcript's
      # nonblocking_open.rs may expect disallowed_methods once, for custom_flags
      # with O_NONBLOCK alone, and nothing else. ADR 0318-rustix-open-flags takes
      # that value from rustix: custom_flags is passed
      # OFlags::NONBLOCK.bits().cast_signed(), and outside comments the parsing
      # crates' src/ names rustix only in that file's `use rustix::fs::OFlags;`,
      # so no rustix function opens, writes or removes a file there. A folder
      # grep cannot read fails the step too.
      - name: Parsing crates allow their banned APIs only in tests
        run: |
          exception=crates/transcript/src/nonblocking_open.rs
          status=0
          matches=$(grep -rnE 'clippy::(disallowed_methods|disallowed_types|style|all)\b' \
              crates/screen/src crates/transcript/src) || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::grep could not read crates/screen/src or crates/transcript/src"
            exit 1
          fi
          found=$(printf '%s\n' "$matches" | awk -v prefix="$exception:" 'NF && index($0, prefix) != 1')
          if [ -n "$found" ]; then
            printf '%s\n' "$found"
            echo "::error::screen and transcript allow clippy's disallowed lints only under tests/"
            exit 1
          fi
          if grep -nE 'clippy::(disallowed_types|style|all)\b' "$exception"; then
            echo "::error::$exception may allow clippy::disallowed_methods alone"
            exit 1
          fi
          if [ "$(grep -c 'clippy::disallowed_methods' "$exception")" -ne 1 ] ||
             [ "$(grep -c 'custom_flags(' "$exception")" -ne 1 ] ||
             ! grep -qxE '[[:space:]]*options\.custom_flags\(OFlags::NONBLOCK\.bits\(\)\.cast_signed\(\)\);' "$exception"; then
            echo "::error::$exception may allow clippy::disallowed_methods once, for custom_flags(OFlags::NONBLOCK.bits().cast_signed()) alone"
            exit 1
          fi
          status=0
          uses=$(grep -rnwE 'rustix' crates/screen/src crates/transcript/src) || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::grep could not read crates/screen/src or crates/transcript/src"
            exit 1
          fi
          found=$(printf '%s\n' "$uses" | awk -v prefix="$exception:" '
            !NF { next }
            {
              code = $0
              sub(/^[^:]*:[0-9]+:/, "", code)
              if (code ~ /^[[:space:]]*\/\//) next
              if (index($0, prefix) == 1 && code ~ /^[[:space:]]*use rustix::fs::OFlags;$/) next
              print
            }')
          if [ -n "$found" ]; then
            printf '%s\n' "$found"
            echo "::error::screen and transcript name rustix only in $exception, as use rustix::fs::OFlags;"
            exit 1
          fi

  # ADR 0194-ts-corpus-job: the TypeScript implementation must still pass the
  # screen and conversation corpora, so that a pull request that changes a case
  # to fit the Rust answer, and not the TypeScript code with it, turns red.
  ts-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      # The fleet-cli job pins the same release and checksum: change both together.
      BUN_VERSION: 1.4.4
      # The line for bun-linux-x64.zip in SHASUMS256.txt of the bun-v1.4.4 release.
      BUN_SHA256: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # No action installs bun (ADR 0110-workspace-and-ci uses checkout alone):
      # the release zip is checked against the pinned sha256 before it is opened.
      # When the release download URL fails (it answered 504 for this asset on
      # 2026-11-08), the same asset is taken through the REST API: the release
      # of the tag names the asset's id. The sha256 check is the same whichever
      # URL served the zip. Each attempt has a time limit and each fetch stops
      # retrying after 150 s, so that the three fetches end (in 630 s at most)
      # before the job's timeout. Every fetch writes to a file: curl rewinds a
      # file before a retry, but not a pipe.
      - name: Install bun
        run: |
          dir="$RUNNER_TEMP/bun"
          mkdir -p "$dir"
          fetch() {
            curl --fail --silent --show-error --location --retry 3 --retry-max-time 150 \
              --connect-timeout 15 --max-time 60 "$@"
          }
          if fetch --output "$dir/bun.zip" \
              "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/bun-linux-x64.zip"; then
            echo "downloaded from the release download URL"
          else
            echo "::warning::the release download URL failed; taking the same asset through the REST API"
            api="https://api.github.com/repos/oven-sh/bun/releases"
            fetch --output "$dir/release.json" "$api/tags/bun-v$BUN_VERSION"
            id=$(jq --exit-status '.assets[] | select(.name == "bun-linux-x64.zip") | .id' "$dir/release.json")
            fetch --header 'Accept: application/octet-stream' --output "$dir/bun.zip" "$api/assets/$id"
            echo "downloaded from $api/assets/$id"
          fi
          echo "$BUN_SHA256  $dir/bun.zip" | sha256sum --check --strict -
          unzip -q "$dir/bun.zip" -d "$dir"
          echo "$dir/bun-linux-x64" >> "$GITHUB_PATH"
      - name: bun --version
        run: test "$(bun --version)" = "$BUN_VERSION"
      # Both test files run without node_modules, so there is no `bun install`.
      # HERDR_TEST_MODE=unit keeps the preload (scripts/test-herdr.ts) from
      # starting herdr, and HERDR_SOCKET points at a socket that does not exist.
      - name: Screen and conversation corpora on the TypeScript implementation
        run: HERDR_TEST_MODE=unit HERDR_SOCKET=/nonexistent/herdr.sock bun test server/screen-fixtures.test.ts server/conversation-fixtures.test.ts

  # ADR 0251-fleet-cli-ci: the Rust `fleet` must pass the fleet CLI contract
  # (fixtures/fleet-cli/), and the TypeScript `fleet` must still pass it, so
  # that a pull request that changes a case to fit the Rust answer, and not
  # bin/fleet.ts with it, turns red. A job of its own, so that a failed bun
  # download does not hide the result of the Rust checks of `linux`.
  fleet-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      # The same release and checksum as the ts-corpus job (ADR 0194-ts-corpus-job):
      # change both together.
      BUN_VERSION: 1.4.4
      # The line for bun-linux-x64.zip in SHASUMS256.txt of the bun-v1.4.4 release.
      BUN_SHA256: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Installs the release and components named in rust/rust-toolchain.toml.
      - name: Install the toolchain
        working-directory: rust
        run: rustup toolchain install --no-self-update && rustc --version
      - name: Build the Rust fleet CLI
        working-directory: rust
        run: cargo build --locked -p herdr-fleet-cli
      # The same step as the ts-corpus job's (ADR 0194-ts-corpus-job): the
      # release zip, or the same asset through the REST API, checked against
      # the pinned sha256 before it is opened.
      - name: Install bun
        run: |
          dir="$RUNNER_TEMP/bun"
          mkdir -p "$dir"
          fetch() {
            curl --fail --silent --show-error --location --retry 3 --retry-max-time 150 \
              --connect-timeout 15 --max-time 60 "$@"
          }
          if fetch --output "$dir/bun.zip" \
              "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/bun-linux-x64.zip"; then
            echo "downloaded from the release download URL"
          else
            echo "::warning::the release download URL failed; taking the same asset through the REST API"
            api="https://api.github.com/repos/oven-sh/bun/releases"
            fetch --output "$dir/release.json" "$api/tags/bun-v$BUN_VERSION"
            id=$(jq --exit-status '.assets[] | select(.name == "bun-linux-x64.zip") | .id' "$dir/release.json")
            fetch --header 'Accept: application/octet-stream' --output "$dir/bun.zip" "$api/assets/$id"
            echo "downloaded from $api/assets/$id"
          fi
          echo "$BUN_SHA256  $dir/bun.zip" | sha256sum --check --strict -
          unzip -q "$dir/bun.zip" -d "$dir"
          echo "$dir/bun-linux-x64" >> "$GITHUB_PATH"
      - name: bun --version
        run: test "$(bun --version)" = "$BUN_VERSION"
      # The test file runs without node_modules, so there is no `bun install`.
      # HERDR_TEST_MODE=unit keeps the preload (scripts/test-herdr.ts) from
      # starting herdr, and HERDR_SOCKET points at a socket that does not exist.
      # The runner points the CLI at its own stub server on a port from 7400 to
      # 7499 and passes the CLI no variable of the job but PATH, HOME and TMPDIR.
      - name: Fleet CLI contract on the TypeScript CLI
        run: HERDR_TEST_MODE=unit HERDR_SOCKET=/nonexistent/herdr.sock bun test bin/fleet-cli-fixtures.test.ts
      - name: Fleet CLI contract on the Rust CLI
        run: HERDR_FLEET_CLI_TARGET=rust:rust/target/debug/fleet HERDR_TEST_MODE=unit HERDR_SOCKET=/nonexistent/herdr.sock bun test bin/fleet-cli-fixtures.test.ts
