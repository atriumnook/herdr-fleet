  { path = "std::fs::File", reason = "herdr-fleet-screen does no file I/O (ADR 0107-crate-split)" },
  { path = "std::fs::OpenOptions", reason = "herdr-fleet-screen does no file I/O (ADR 0107-crate-split)" },
