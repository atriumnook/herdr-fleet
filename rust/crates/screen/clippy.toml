# ADR 0107-crate-split: herdr-fleet-screen reads the screen text it is given and
# uses no std::fs, std::process or std::net. Clippy reads this file for this
# crate only (it looks in the crate's folder first), and the CI runs clippy
# with -D warnings, so a use of these fails the check.
