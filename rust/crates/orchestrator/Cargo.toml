[package]
name = "herdr-fleet-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
protocol.workspace = true
screen.workspace = true
herdr.workspace = true
child-process.workspace = true
axum = { workspace = true, features = ["json", "query"] }
# The roles' and fleet.json's user-named maps keep the order they were written in
# (ADR 0244-phase-3-dependencies, "map の順").
indexmap.workspace = true
# The usage readings' reset times in a named IANA zone and in the server's own zone
# (`TimeZone::get`, `TimeZone::system`; ADR 0288-orchestrator-jiff).
jiff.workspace = true
regex.workspace = true
# The YAML frontmatter of the role files (ADR 0279-orchestrator-yaml). The loader's
# `allow_duplicate_keys`, which Bun's last-value-wins needs, takes saphyr-parser's
# `Parser`, which saphyr does not re-export; no default features drops encoding_rs.
# Bump the two together: the loader only takes a Parser of the saphyr-parser that
# saphyr itself links.
saphyr = { version = "0.3.3", default-features = false }
saphyr-parser = "0.3.3"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-util.workspace = true

# CC (ADR 0242-phase-3-split) runs the CLI's library against the router over real
# TCP; the other tests call the router with tower's `oneshot` and pause tokio's clock.
[dev-dependencies]
cli.workspace = true
axum = { workspace = true, features = ["http1", "tokio"] }
http-body-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
