[package]
name = "herdr-fleet-herdr"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
herdr-api.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

# `test-util` lets this crate's tests stop tokio's clock
# (`#[tokio::test(start_paused = true)]`; the first ones come with #257) when cargo
# builds this crate alone (`cargo test -p herdr-fleet-herdr`), not only when the
# orchestrator's dev-dependency turns it on in a workspace build (#289).
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
