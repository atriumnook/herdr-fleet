# ADR 0107-crate-split: herdr-fleet-transcript reads files and does nothing else:
# no file writes, no std::process, no std::net. Clippy reads this file for this
# crate only (it looks in the crate's folder first), and the CI runs clippy
# with -D warnings, so a use of these fails the check. Reading (File::open,
# std::fs::read, metadata, read_dir) stays allowed.
disallowed-types = [
  { path = "std::fs::DirBuilder", reason = "herdr-fleet-transcript writes no file (ADR 0107-crate-split)" },
  { path = "std::process::Command", reason = "herdr-fleet-transcript starts no process (ADR 0107-crate-split)" },
  { path = "std::process::Child", reason = "herdr-fleet-transcript starts no process (ADR 0107-crate-split)" },
  { path = "std::net::TcpStream", reason = "herdr-fleet-transcript does no network I/O (ADR 0107-crate-split)" },
  { path = "std::net::TcpListener", reason = "herdr-fleet-transcript does no network I/O (ADR 0107-crate-split)" },
  { path = "std::net::UdpSocket", reason = "herdr-fleet-transcript does no network I/O (ADR 0107-crate-split)" },
  { path = "std::os::unix::net::UnixStream", reason = "herdr-fleet-transcript does no socket I/O (ADR 0107-crate-split)" },
  { path = "std::os::unix::net::UnixListener", reason = "herdr-fleet-transcript does no socket I/O (ADR 0107-crate-split)" },
  { path = "std::os::unix::net::UnixDatagram", reason = "herdr-fleet-transcript does no socket I/O (ADR 0107-crate-split)" },
]
disallowed-methods = [
  { path = "std::fs::write", reason = "herdr-fleet-transcript writes no file (ADR 0107-crate-split)" },
  { path = "std::fs::copy", reason = "herdr-fleet-transcript writes no file (ADR 0107-crate-split)" },
  { path = "std::fs::rename", reason = "herdr-fleet-transcript writes no file (ADR 0107-crate-split)" },
  { path = "std::fs::hard_link", reason = "herdr-fleet-transcript writes no file (ADR 0107-crate-split)" },
  { path = "std::fs::set_permissions", reason = "herdr-fleet-transcript writes no file (ADR 0107-crate-split)" },
  { path = "std::fs::create_dir", reason = "herdr-fleet-transcript writes no file (ADR 0107-crate-split)" },
  { path = "std::fs::create_dir_all", reason = "herdr-fleet-transcript writes no file (ADR 0107-crate-split)" },
  { path = "std::fs::remove_file", reason = "herdr-fleet-transcript writes no file (ADR 0107-crate-split)" },
  { path = "std::fs::remove_dir", reason = "herdr-fleet-transcript writes no file (ADR 0107-crate-split)" },
  { path = "std::fs::remove_dir_all", reason = "herdr-fleet-transcript writes no file (ADR 0107-crate-split)" },
  { path = "std::fs::File::create", reason = "herdr-fleet-transcript writes no file (ADR 0107-crate-split)" },
  { path = "std::fs::File::create_new", reason = "herdr-fleet-transcript writes no file (ADR 0107-crate-split)" },
  { path = "std::fs::File::set_len", reason = "herdr-fleet-transcript writes no file (ADR 0107-crate-split)" },
  { path = "std::fs::File::set_permissions", reason = "herdr-fleet-transcript writes no file (ADR 0107-crate-split)" },
  { path = "std::fs::File::set_times", reason = "herdr-fleet-transcript writes no file (ADR 0107-crate-split)" },
  { path = "std::fs::File::set_modified", reason = "herdr-fleet-transcript writes no file (ADR 0107-crate-split)" },
  { path = "std::fs::OpenOptions::write", reason = "herdr-fleet-transcript opens files for reading only (ADR 0107-crate-split)" },
  { path = "std::fs::OpenOptions::append", reason = "herdr-fleet-transcript opens files for reading only (ADR 0107-crate-split)" },
  { path = "std::fs::OpenOptions::truncate", reason = "herdr-fleet-transcript opens files for reading only (ADR 0107-crate-split)" },
