  { path = "std::fs::OpenOptions::create_new", reason = "herdr-fleet-transcript opens files for reading only (ADR 0107-crate-split)" },
  { path = "std::os::unix::fs::symlink", reason = "herdr-fleet-transcript writes no file (ADR 0107-crate-split)" },
  { path = "std::fs::soft_link", reason = "herdr-fleet-transcript writes no file (ADR 0107-crate-split)" },
  { path = "std::os::unix::fs::chown", reason = "herdr-fleet-transcript writes no file (ADR 0107-crate-split)" },
  { path = "std::os::unix::fs::fchown", reason = "herdr-fleet-transcript writes no file (ADR 0107-crate-split)" },
