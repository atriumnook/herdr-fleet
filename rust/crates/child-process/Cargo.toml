[package]
name = "herdr-fleet-child-process"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util.workspace = true

# SIGTERM before SIGKILL; Windows uses tokio's `start_kill` (ADR 0242-phase-3-split).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process", "std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
